<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hello, World!</title>
</head>

<body>
    <h1 id="main-heading">Hello!</h1>
    <p id="first-paragraph">Welcome to my document.</p>
    <script>
        let heading = document.getElementById("main-heading");
        console.log(heading.innerText);
        heading.innerText = "Hi there...";
        console.log(heading.innerText);
        console.log(typeof (heading));
        let paragraph = document.getElementById("first-paragraph");
        paragraph.innerText = "We are playing with the <p> DOM!";
        console.log(paragraph.innerText);
    </script>
</body>

</html>
