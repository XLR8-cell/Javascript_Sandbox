<html>

<body>
    <script>
        let speed = prompt("input your current speed.");
        console.log(`Your current speed is ${speed} mph`);
        if (speed > 25) {
            console.log("Slow Down!!!");
        } else if (speed > 15) {
            console.log("You are obeying the speed limit.");
        } else if (speed > 10) {
            console.log("You are driving slow and you should accelerate a little");
        } else {
            console.log("You are almost stopping!");
        }
    </script>
</body>

</html>
