<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handlers</title>
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <h1 id="main-heading">Hello,<em>World!</em></h1>
    <ul id="word-list">
        <li>The</li>
        <li>Dog</li>
        <li>Cat</li>
        <li>Is</li>
        <li>Was</li>
        <li>And</li>
        <li>Hungry</li>
        <li>Green</li>
    </ul>

    <p id="sentence"></p>

    <div id="box"></div>


    <script src="script.js"></script>
    <!--By placing the script element at the
    end of the body, we can be sure that all the page content has been loaded
    into the DOM before we run our JavaScript because the browser builds the DOM
    incrementally by reading through the HTML file from top to bottom.-->
</body>

</html>
